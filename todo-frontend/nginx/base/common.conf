sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 15;
types_hash_max_size 4096;

# Compress text responses at the origin. Cloudflare already serves HTTP/2/3
# and compresses for clients, but this also shrinks the Cloudflare <-> origin
# transfer and covers requests that bypass the edge cache.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Cache static file metadata. Safe because assets are baked into the image.
open_file_cache max=1000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server_tokens off;

include /etc/nginx/mime.types;
default_type application/octet-stream;

log_format main
  '[$time_local] $host "$request" $status $body_bytes_sent '
  '$remote_addr $http_cf_connecting_ip '
  '"$http_referer" "$http_user_agent" '
  'request_time=$request_time '
  'upstream_connect_time=$upstream_connect_time '
  'upstream_response_time=$upstream_response_time';

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $server_name;
proxy_set_header CF-Connecting-IP $http_CF_Connecting_IP;

set_real_ip_from 192.168.0.0/16;